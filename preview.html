<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
  }
  .speech-wrap {
    position: relative;
    width: 100%;
    padding: 4px 10px;
    display: flex;
    align-items: center;
  }
  .speech-bubble {
    position: relative;
    width: 100%;
    background: #202c33;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    padding: 9px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  /* Konuşma Balonu Kuyruğu (WhatsApp İkonuna Doğru Ok) */
  body.tail-right .speech-bubble::after {
    content: '';
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    border-width: 8px 0 8px 8px;
    border-style: solid;
    border-color: transparent transparent transparent #202c33;
  }
  body.tail-left .speech-bubble::after {
    content: '';
    position: absolute;
    left: -8px;
    top: 50%;
    transform: translateY(-50%);
    border-width: 8px 8px 8px 0;
    border-style: solid;
    border-color: transparent #202c33 transparent transparent;
  }
  .p-avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    overflow: hidden;
    background: #00a884;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
  }
  .p-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .p-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .p-name {
    font-size: 12.5px;
    font-weight: 700;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .p-text {
    font-size: 12px;
    color: #d1d7db;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.25;
  }
</style>
</head>
<body class="tail-right">
  <div class="speech-wrap">
    <div class="speech-bubble" id="speechBubble">
      <div class="p-avatar" id="pAvatar">WA</div>
      <div class="p-info">
        <div class="p-name" id="pName">WhatsApp</div>
        <div class="p-text" id="pText">Yeni mesaj</div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const speechBubble = document.getElementById('speechBubble');
    const pAvatar = document.getElementById('pAvatar');
    const pName = document.getElementById('pName');
    const pText = document.getElementById('pText');

    let currentTarget = null;

    function getInitials(name) {
      if (!name) return 'WA';
      const parts = String(name).trim().split(/\s+/);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }
      return String(name).slice(0, 2).toUpperCase();
    }

    ipcRenderer.on('show-preview-data', (_event, data) => {
      currentTarget = { name: data.name, index: data.index };
      document.body.className = data.tailDirection === 'left' ? 'tail-left' : 'tail-right';
      pName.textContent = data.name || 'WhatsApp';
      pText.textContent = data.body || 'Yeni mesaj';

      pAvatar.innerHTML = '';
      if (data.avatar) {
        const img = document.createElement('img');
        img.src = data.avatar;
        img.onerror = () => {
          pAvatar.innerHTML = '';
          pAvatar.textContent = getInitials(data.name);
        };
        pAvatar.appendChild(img);
      } else {
        pAvatar.textContent = getInitials(data.name);
      }
    });

    speechBubble.addEventListener('click', () => {
      ipcRenderer.send('preview-bubble-clicked', currentTarget);
    });
  </script>
</body>
</html>
