<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111b21;
    color: #e9edef;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(0, 168, 132, 0.35);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  }
  .header {
    height: 40px;
    min-height: 40px;
    background: #202c33;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
  }
  .header-title {
    font-size: 13px;
    font-weight: 600;
    color: #e9edef;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .close-btn {
    background: transparent;
    border: none;
    color: #aebac1;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 5px;
  }
  .close-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #ffffff;
  }
  .search-box {
    padding: 8px 10px;
    background: #111b21;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .search-input {
    width: 100%;
    background: #202c33;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 7px;
    padding: 7px 10px;
    color: #e9edef;
    font-size: 12.5px;
    outline: none;
  }
  .search-input:focus {
    border-color: #00a884;
  }
  .chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .chat-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    transition: background 0.12s ease;
  }
  .chat-item:hover {
    background: #202c33;
  }
  .chat-item:active {
    background: #2a3942;
  }
  .avatar {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    background: #2a3942;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: #00a884;
    overflow: hidden;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .chat-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .chat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .chat-name {
    font-size: 13.5px;
    font-weight: 600;
    color: #e9edef;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-time {
    font-size: 11px;
    color: #8696a0;
    white-space: nowrap;
  }
  .chat-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .chat-preview {
    font-size: 12px;
    color: #8696a0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .unread-pill {
    background: #00a884;
    color: #111b21;
    font-size: 11px;
    font-weight: 700;
    min-width: 19px;
    height: 19px;
    padding: 0 5px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .empty-state {
    padding: 32px 16px;
    text-align: center;
    color: #8696a0;
    font-size: 12.5px;
  }
  ::-webkit-scrollbar {
    width: 5px;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.16);
    border-radius: 3px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-title">👥 Sohbet Seç</div>
    <button class="close-btn" id="closeBtn" title="Kapat">✕</button>
  </div>
  <div class="search-box">
    <input
      type="text"
      class="search-input"
      id="searchInput"
      placeholder="🔍 Kişi veya sohbet ara..."
      autofocus
    />
  </div>
  <div class="chat-list" id="chatList">
    <div class="empty-state">Sohbet listesi yükleniyor...</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const chatListEl = document.getElementById('chatList');
    const searchInput = document.getElementById('searchInput');
    const closeBtn = document.getElementById('closeBtn');

    let allChats = [];

    closeBtn.addEventListener('click', () => {
      ipcRenderer.send('close-selector-window');
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        ipcRenderer.send('close-selector-window');
      }
    });

    function renderChats() {
      const q = (searchInput.value || '').trim().toLowerCase();
      const filtered = q
        ? allChats.filter(
            (c) =>
              (c.name && c.name.toLowerCase().includes(q)) ||
              (c.preview && c.preview.toLowerCase().includes(q))
          )
        : allChats;

      chatListEl.textContent = '';

      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = q ? 'Eşleşen sohbet bulunamadı.' : 'Sohbet listesi bekleniyor...';
        chatListEl.appendChild(empty);
        return;
      }

      filtered.forEach((chat) => {
        const item = document.createElement('div');
        item.className = 'chat-item';

        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'avatar';
        if (chat.avatar) {
          const img = document.createElement('img');
          img.src = chat.avatar;
          avatarDiv.appendChild(img);
        } else {
          avatarDiv.textContent = (chat.name || '?').charAt(0).toUpperCase();
        }

        const infoDiv = document.createElement('div');
        infoDiv.className = 'chat-info';

        const topDiv = document.createElement('div');
        topDiv.className = 'chat-top';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'chat-name';
        nameSpan.textContent = chat.name || 'Bilinmeyen';

        const timeSpan = document.createElement('span');
        timeSpan.className = 'chat-time';
        timeSpan.textContent = chat.time || '';

        topDiv.appendChild(nameSpan);
        topDiv.appendChild(timeSpan);

        const bottomDiv = document.createElement('div');
        bottomDiv.className = 'chat-bottom';

        const previewSpan = document.createElement('span');
        previewSpan.className = 'chat-preview';
        previewSpan.textContent = chat.preview || '';
        bottomDiv.appendChild(previewSpan);

        if (chat.unread && chat.unread > 0) {
          const badge = document.createElement('span');
          badge.className = 'unread-pill';
          badge.textContent = String(chat.unread);
          bottomDiv.appendChild(badge);
        }

        infoDiv.appendChild(topDiv);
        infoDiv.appendChild(bottomDiv);

        item.appendChild(avatarDiv);
        item.appendChild(infoDiv);

        item.addEventListener('click', () => {
          ipcRenderer.send('selector-pick-chat', {
            name: chat.name,
            index: chat.index
          });
        });

        chatListEl.appendChild(item);
      });
    }

    searchInput.addEventListener('input', () => {
      renderChats();
    });

    // Liste aşağı kaydırıldığında WhatsApp'ın arka plandaki listesini de kaydırıp daha fazla kişi yükle
    chatListEl.addEventListener('scroll', () => {
      if (chatListEl.scrollTop + chatListEl.clientHeight >= chatListEl.scrollHeight - 60) {
        ipcRenderer.send('selector-scroll-more');
      }
    });

    ipcRenderer.on('update-chat-list', (_event, chats) => {
      if (Array.isArray(chats)) {
        allChats = chats;
        renderChats();
      }
    });

    ipcRenderer.on('focus-search', () => {
      searchInput.value = '';
      searchInput.focus();
      renderChats();
    });
  </script>
</body>
</html>
